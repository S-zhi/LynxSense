[project]
name = "subtrans-backend"
version = "1.0.2"
description = "LynxSense - 视频信息理解与处理工作台"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.138.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0,<3",
    "python-multipart>=0.0.9",
    "replicate>=1.0.7",
    "uvicorn[standard]>=0.49.0",
    "yt-dlp>=2024.0.0",
    # 后续阶段再加：fastapi, uvicorn, rq, redis ...
]

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
