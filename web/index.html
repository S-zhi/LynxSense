<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtitles AI</title>
    <meta name="description" content="本地视频字幕处理台：下载、识别、翻译、烧录，一站式产出带字幕成品" />
    <link rel="icon" href="assets/subtitles-ai-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/console.css" />
    <link rel="stylesheet" href="styles/queue.css" />
    <link rel="stylesheet" href="styles/preview.css" />
    <link rel="stylesheet" href="styles/probe.css" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  </head>
  <body>
    <div class="container" aria-hidden="true"></div>
    <div class="app">
      <!-- 侧边工具栏 -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <img src="assets/subtitles-ai-logo.svg" alt="" />
          </span>
          <span class="brand__name">Subtitles AI</span>
        </div>

        <nav class="nav" id="nav" aria-label="功能导航">
          <button class="nav__item is-active" type="button" data-view="tasks">
            <i class="ph ph-rows" aria-hidden="true"></i><span>任务</span>
          </button>
          <button class="nav__item" type="button" data-view="preview">
            <i class="ph ph-monitor-play" aria-hidden="true"></i><span>视频预览</span>
          </button>
          <button class="nav__item" type="button" data-view="probe">
            <i class="ph ph-pulse" aria-hidden="true"></i><span>下载测试</span>
          </button>
        </nav>

        <div class="sidebar__spacer"></div>

        <section class="supported-sites" aria-labelledby="supportedSitesTitle">
          <h2 id="supportedSitesTitle">支持网站</h2>
          <div class="supported-sites__cluster">
            <a class="site-icon" href="https://www.pornhub.com/" target="_blank" rel="noreferrer" title="Pornhub" aria-label="打开 Pornhub">
              <span class="site-icon__text">Porn</span>
              <span class="site-icon__hub">hub</span>
            </a>
          </div>
        </section>

        <section class="settings" aria-labelledby="settingsTitle">
          <h2 id="settingsTitle" class="settings__title">通知</h2>
          <label class="settings__row" for="notifyToggle">
            <span class="settings__name">任务完成 / 失败时弹通知</span>
            <span class="settings__switch">
              <input id="notifyToggle" type="checkbox" />
              <span class="settings__slider" aria-hidden="true"></span>
            </span>
          </label>
          <p class="settings__hint" id="notifyHint">浏览器未授权时无法弹出通知。</p>
        </section>

        <div class="sidebar__foot">
          <button class="iconbtn" id="themeToggle" type="button" aria-label="切换深色 / 浅色">
            <i class="ph ph-moon" aria-hidden="true"></i>
          </button>
        </div>
      </aside>

      <!-- 内容区 -->
      <main class="content">
        <!-- ============ 任务 ============ -->
        <section class="view is-active" data-view="tasks" id="view-tasks">
          <!-- 任务控制台 -->
          <form class="console" id="taskForm" novalidate>
            <div class="console__bar" id="consoleBar">
              <span class="console__icon" aria-hidden="true"><i class="ph ph-link-simple"></i></span>
              <input
                class="console__input"
                id="url"
                name="url"
                type="text"
                inputmode="url"
                autocomplete="off"
                aria-label="视频链接"
                placeholder="粘贴视频页面地址，或拖入本地视频"
              />
              <label class="iconbtn console__upload" for="videoFile" id="uploadBtn" role="button" tabindex="0" aria-label="选择本地视频" title="选择本地视频">
                <i class="ph ph-upload-simple" aria-hidden="true">
                  <input
                    class="console__file"
                    id="videoFile"
                    name="videoFile"
                    type="file"
                    accept="video/*,.mp4,.mov,.mkv,.webm,.avi,.m4v,.flv,.ts,.mpeg,.mpg,.wmv"
                  />
                </i>
              </label>
              <button class="btn btn--primary console__go" type="submit" id="submitBtn">
                <i class="ph ph-play" aria-hidden="true"></i><span>开始处理</span>
              </button>
            </div>
            <p class="console__hint" id="urlHint">粘贴单个视频页面地址，或把本地视频拖进输入框</p>

            <div class="params">
              <fieldset class="param" style="border:0;margin:0;padding:0">
                <span class="param__label">是否需要字幕</span>
                <div class="segmented" role="radiogroup" aria-label="是否需要字幕">
                  <label class="segmented__opt"><input type="radio" name="needSubtitle" value="on" checked /><span>需要</span></label>
                  <label class="segmented__opt"><input type="radio" name="needSubtitle" value="off" /><span>仅下载</span></label>
                </div>
              </fieldset>
              <div class="param">
                <span class="param__label">源语言</span>
                <select class="select" id="sourceLang" name="sourceLang" aria-label="源语言">
                  <option value="en" selected>加载中</option>
                </select>
              </div>
              <div class="param">
                <span class="param__label">目标语言</span>
                <select class="select" id="targetLang" name="targetLang" aria-label="目标语言">
                  <option value="zh-CN" selected>简体中文</option>
                  <option value="zh-TW">繁体中文</option>
                  <option value="en">英语</option>
                  <option value="ja">日语</option>
                  <option value="ko">韩语</option>
                </select>
              </div>
              <fieldset class="param" style="border:0;margin:0;padding:0">
                <span class="param__label">字幕模式</span>
                <div class="segmented" role="radiogroup" aria-label="字幕模式">
                  <label class="segmented__opt"><input type="radio" name="mode" value="mono" checked /><span>仅译文</span></label>
                  <label class="segmented__opt"><input type="radio" name="mode" value="bilingual" /><span>双语</span></label>
                </div>
              </fieldset>
              <fieldset class="param" style="border:0;margin:0;padding:0">
                <span class="param__label">烧录方式</span>
                <div class="segmented" role="radiogroup" aria-label="烧录方式">
                  <label class="segmented__opt"><input type="radio" name="burn" value="hard" checked /><span>硬烧录</span></label>
                  <label class="segmented__opt"><input type="radio" name="burn" value="soft" /><span>软字幕</span></label>
                </div>
              </fieldset>
              <div class="param">
                <span class="param__label">Replicate模型</span>
                <select class="select" id="model" name="model" aria-label="Whisper 模型">
                  <option value="small" selected>加载中</option>
                </select>
              </div>
              <div class="param">
                <span class="param__label">翻译引擎</span>
                <select class="select" id="engine" name="engine" aria-label="翻译引擎"></select>
              </div>
            </div>
          </form>

          <!-- 处理队列 -->
          <section class="queue">
            <div class="queue__head">
              <h2>处理队列</h2>
              <div class="filters" id="filters" role="tablist" aria-label="按状态筛选">
                <button class="chip is-active" data-filter="all" role="tab">全部</button>
                <button class="chip" data-filter="active" role="tab">进行中</button>
                <button class="chip" data-filter="done" role="tab">已完成</button>
                <button class="chip" data-filter="failed" role="tab">失败</button>
              </div>
            </div>
            <div class="queue__list" id="taskList" aria-live="polite"></div>
          </section>
        </section>

        <!-- ============ 预览 ============ -->
        <section class="view" data-view="preview" id="view-preview">
          <div class="screening">
            <div class="screening__stage" id="previewStage"></div>
            <aside class="screening__rail">
              <h2>已完成</h2>
              <div class="screening__list" id="previewList"></div>
            </aside>
          </div>
        </section>

        <!-- ============ 下载测试 ============ -->
        <section class="view" data-view="probe" id="view-probe">
          <div class="probe">
            <header class="probe__head">
              <div>
                <h2>下载测试</h2>
                <p>检查链接是否能被 yt-dlp 解析并找到可下载格式。</p>
              </div>
              <span class="probe__badge"><i class="ph ph-hard-drives" aria-hidden="true"></i>不下载文件</span>
            </header>

            <form class="probe__panel" id="probeForm" novalidate>
              <div class="probe__bar" id="probeBar">
                <span class="probe__icon" aria-hidden="true"><i class="ph ph-link-simple"></i></span>
                <input
                  class="probe__input"
                  id="probeUrl"
                  name="probeUrl"
                  type="url"
                  inputmode="url"
                  autocomplete="off"
                  aria-label="测试链接"
                  placeholder="粘贴要测试的视频页面地址"
                  required
                />
                <button class="btn btn--primary probe__go" id="probeBtn" type="submit">
                  <i class="ph ph-pulse" aria-hidden="true"></i><span>开始测试</span>
                </button>
              </div>
              <p class="probe__hint" id="probeHint">等待输入链接</p>
            </form>

            <div class="probe-result is-idle" id="probeResult" aria-live="polite">
              <div class="probe-result__icon"><i class="ph ph-link" aria-hidden="true"></i></div>
              <div class="probe-result__body">
                <div class="probe-result__title">未开始</div>
                <div class="probe-result__desc">结果会显示在这里。</div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
